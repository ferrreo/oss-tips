services:
  postgres:
    image: postgres:16-alpine
    container_name: oss-tips-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: oss_tips
      POSTGRES_PASSWORD: oss_tips_dev
      POSTGRES_DB: oss_tips
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oss_tips -d oss_tips']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage used by the upload quarantine pipeline.
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.12
    container_name: oss-tips-rustfs
    restart: unless-stopped
    profiles: ['storage']
    command: /data
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      RUSTFS_ACCESS_KEY: OSS_TIPS_DEV
      RUSTFS_SECRET_KEY: oss_tips_dev_secret_change_me
      RUSTFS_RPC_SECRET: oss_tips_dev_rpc_secret_change_me
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
    volumes:
      - rustfs_data_v1:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:9000/health']
      interval: 5s
      timeout: 5s
      retries: 20

  # Single-replica development ledger. Production uses six dedicated replicas.
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    container_name: oss-tips-tigerbeetle
    restart: unless-stopped
    profiles: ['ledger']
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        test -f /data/0_0.tigerbeetle ||
        /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 --development /data/0_0.tigerbeetle;
        exec /tigerbeetle start --addresses=0.0.0.0:3000 --development /data/0_0.tigerbeetle
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - tigerbeetle_data:/data
    security_opt:
      - seccomp:unconfined
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 3000']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  rustfs_data_v1:
  tigerbeetle_data:
