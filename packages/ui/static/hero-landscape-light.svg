<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="pll-title pll-desc">
  <title id="pll-title">Paperlight forest and mountains</title>
  <desc id="pll-desc">A warm paper-sky landscape with distant ridges, a moss mid-range, and an asymmetric forest.</desc>
  <defs>
    <linearGradient id="pll-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7EED8"/>
      <stop offset="42%" stop-color="#FBF7EF"/>
      <stop offset="100%" stop-color="#E8E0C8"/>
    </linearGradient>
    <linearGradient id="pll-far" x1="0" y1="0" x2="0" y2="1">
