    <linearGradient id="pll-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A6A45"/>
      <stop offset="100%" stop-color="#244A30"/>
    </linearGradient>
    <radialGradient id="pll-sun" cx="78%" cy="22%" r="18%">
      <stop offset="0%" stop-color="#E8C27A" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#B88747" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B88747" stop-opacity="0"/>
    </radialGradient>
    <filter id="pll-grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
    </filter>
  </defs>
